<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 700" width="420" height="700" role="img" aria-label="Aniket Das ID card lanyard">
<title>Aniket Das — Executive ID Badge</title>
<defs>
<style type="text/css"><![CDATA[
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap');

text { font-family: 'Space Grotesk', 'Fira Code', -apple-system, sans-serif; }

@keyframes settle {
  0% { transform: rotate(0deg) translateY(-700px); }
  18% { transform: rotate(0deg) translateY(0); }
  30% { transform: rotate(13deg); }
  46% { transform: rotate(-9deg); }
  62% { transform: rotate(6deg); }
  78% { transform: rotate(-3.5deg); }
  92% { transform: rotate(1.5deg); }
  100% { transform: rotate(0deg); }
}

@keyframes sway {
  0%, 100% { transform: rotate(-3.5deg); }
  50% { transform: rotate(3.5deg); }
}

@keyframes cardWobble {
  0%, 100% { transform: rotate(2deg); }
  50% { transform: rotate(-2deg); }
}

@keyframes realtimeShine {
  0%, 100% { transform: translateX(-100px) skewX(-20deg); opacity: 0.7; }
  25% { transform: translateX(20px) skewX(-20deg); opacity: 0.9; }
  50% { transform: translateX(200px) skewX(-20deg); opacity: 0.7; }
  75% { transform: translateX(80px) skewX(-20deg); opacity: 0.9; }
}

@keyframes twinkle {
  0%, 100% { opacity: 0.15; transform: scale(0.6); }
  50% { opacity: 1; transform: scale(1.2); }
}

@keyframes borderGlow {
  0%, 100% { stroke: #4f46e5; }
  25% { stroke: #818cf8; }
  50% { stroke: #6366f1; }
  75% { stroke: #3b82f6; }
}

.settle { transform-origin: 210px 6px; animation: settle 3.4s cubic-bezier(.34,1.1,.5,1) forwards; }
.sway   { transform-origin: 210px 6px; animation: sway 4.6s ease-in-out 3.4s infinite; }
.wob    { transform-origin: 210px 320px; animation: cardWobble 4.6s ease-in-out 3.4s infinite; }
.shine  { animation: realtimeShine 4.6s ease-in-out 3.4s infinite; }
.tw     { transform-box: fill-box; transform-origin: center; animation: twinkle 3s ease-in-out infinite; }
.border-glow { animation: borderGlow 6s ease-in-out infinite; }

/* ── 3D Hover tilt via invisible quadrants ── */
.card-body {
  transform-origin: 210px 460px;
  transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), filter 0.45s ease;
  transform-style: preserve-3d;
}
.hz { cursor: pointer; pointer-events: all; }

.hz-tl:hover ~ .card-body { transform: perspective(800px) rotateY(-10deg) rotateX(6deg) scale(1.03); }
.hz-tr:hover ~ .card-body { transform: perspective(800px) rotateY(10deg)  rotateX(6deg) scale(1.03); }
.hz-bl:hover ~ .card-body { transform: perspective(800px) rotateY(-10deg) rotateX(-6deg) scale(1.03); }
.hz-br:hover ~ .card-body { transform: perspective(800px) rotateY(10deg)  rotateX(-6deg) scale(1.03); }

/* Shift shine on hover to match tilt angle */
.hz:hover ~ .card-body .shine { animation: none; transition: transform 0.45s ease, opacity 0.45s ease; }
.hz-tl:hover ~ .card-body .shine { transform: translateX(-50px) skewX(-20deg); opacity: 0.9; }
.hz-tr:hover ~ .card-body .shine { transform: translateX(160px) skewX(-20deg); opacity: 0.9; }
.hz-bl:hover ~ .card-body .shine { transform: translateX(-70px) skewX(-20deg); opacity: 0.75; }
.hz-br:hover ~ .card-body .shine { transform: translateX(180px) skewX(-20deg); opacity: 0.75; }

/* Pause oscillations while hovering */
.lanyard-card-container:hover .sway,
.lanyard-card-container:hover .wob { animation-play-state: paused; }
]]></style>

<!-- Ambient Glow -->
<radialGradient id="auraglow" cx="50%" cy="55%" r="50%">
  <stop offset="0%"   stop-color="#6366f1" stop-opacity="0.30"/>
  <stop offset="60%"  stop-color="#3b82f6" stop-opacity="0.10"/>
  <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
</radialGradient>

<!-- Belt Strap Gradient -->
<linearGradient id="strapg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%"   stop-color="#4338ca"/>
  <stop offset="50%"  stop-color="#818cf8"/>
  <stop offset="100%" stop-color="#3b82f6"/>
</linearGradient>

<!-- Metallic Clasp -->
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%"   stop-color="#e2e8f0"/>
  <stop offset="40%"  stop-color="#94a3b8"/>
  <stop offset="70%"  stop-color="#475569"/>
  <stop offset="100%" stop-color="#cbd5e1"/>
</linearGradient>

<!-- Holographic Glass Sweep -->
<linearGradient id="shineg" x1="0" y1="0" x2="1" y2="0.15">
  <stop offset="0%"  stop-color="#ffffff" stop-opacity="0"/>
  <stop offset="40%" stop-color="#ffffff" stop-opacity="0.15"/>
  <stop offset="50%" stop-color="#a5b4fc" stop-opacity="0.22"/>
  <stop offset="60%" stop-color="#ffffff" stop-opacity="0.15"/>
  <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>

<!-- Drop Shadow -->
<filter id="cardShadow" x="-25%" y="-10%" width="150%" height="135%">
  <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#030712" flood-opacity="0.85"/>
  <feDropShadow dx="0" dy="4"  stdDeviation="8"  flood-color="#4f46e5" flood-opacity="0.25"/>
</filter>

<!-- Card Rounded-Rect Clip -->
<clipPath id="cardclip">
  <rect x="83" y="248" width="254" height="432" rx="22"/>
</clipPath>

</defs>

<!-- ═══════ Scene Background ═══════ -->
<!-- Ambient Glow -->
<circle cx="210" cy="450" r="250" fill="url(#auraglow)"/>

<!-- Twinkling Stars -->
<g class="tw" style="animation-delay:0.3s"><path d="M50 185 l3.5 9 9 3.5-9 3.5-3.5 9-3.5-9-9-3.5 9-3.5z" fill="#818cf8"/></g>
<g class="tw" style="animation-delay:1.5s"><path d="M375 275 l3 7.5 7.5 3-7.5 3-3 7.5-3-7.5-7.5-3 7.5-3z" fill="#60a5fa"/></g>
<g class="tw" style="animation-delay:2.4s"><path d="M42 520 l3 7.5 7.5 3-7.5 3-3 7.5-3-7.5-7.5-3 7.5-3z" fill="#3b82f6"/></g>
<g class="tw" style="animation-delay:0.9s"><path d="M380 520 l2.4 6.4 6.4 2.4-6.4 2.4-2.4 6.4-2.4-6.4-6.4-2.4 6.4-2.4z" fill="#a5b4fc"/></g>

<!-- ═══════ Lanyard Assembly ═══════ -->
<g class="lanyard-card-container">
<g class="settle"><g class="sway">

  <!-- ── Strap ── -->
  <g>
    <path d="M189 -6 L231 -6 L227 208 L193 208 Z" fill="url(#strapg)"/>
    <line x1="194.5" y1="0" x2="197"   y2="207" stroke="#fff" stroke-opacity="0.6" stroke-width="1.2" stroke-dasharray="4 3"/>
    <line x1="225.5" y1="0" x2="223"   y2="207" stroke="#fff" stroke-opacity="0.6" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="0" y="0" font-family="'Outfit',sans-serif" font-size="10.5" font-weight="900" fill="#fff" letter-spacing="4" text-anchor="middle" transform="translate(210,100) rotate(90)">AI ORCHESTRATOR</text>
  </g>

  <!-- ── Metal Clasp & Ring ── -->
  <rect x="186" y="205" width="48" height="24" rx="5" fill="url(#metal)" stroke="#334155" stroke-width="1"/>
  <rect x="197" y="210" width="26" height="7" rx="3.5" fill="#1e293b"/>
  <circle cx="210" cy="240" r="14" fill="none" stroke="url(#metal)" stroke-width="5"/>

  <!-- ── Card + Wobble ── -->
  <g class="wob">

    <!-- Invisible hover-detect quadrants (BEFORE card-body so ~ selector works) -->
    <rect class="hz hz-tl" x="83"  y="248" width="127" height="216" fill="transparent"/>
    <rect class="hz hz-tr" x="210" y="248" width="127" height="216" fill="transparent"/>
    <rect class="hz hz-bl" x="83"  y="464" width="127" height="216" fill="transparent"/>
    <rect class="hz hz-br" x="210" y="464" width="127" height="216" fill="transparent"/>

    <!-- ── Card Body (tilts on hover) ── -->
    <g class="card-body">

      <!-- Glowing border rect (behind clipped content) -->
      <rect x="83" y="248" width="254" height="432" rx="22" fill="#0a0a12" stroke="#4f46e5" stroke-width="2" class="border-glow" filter="url(#cardShadow)"/>

      <!-- Clipped card content = the user's custom badge image -->
      <g clip-path="url(#cardclip)">
        <image href="{AVATAR_BASE64}" x="83" y="248" width="254" height="432" preserveAspectRatio="xMidYMid meet"/>
      </g>

      <!-- Slot punch hole at top center -->
      <ellipse cx="210" cy="264" rx="12" ry="6" fill="#0a0a12" stroke="#1e293b" stroke-width="1"/>

      <!-- Real-time reflection sweep -->
      <rect class="shine" x="83" y="248" width="120" height="432" rx="22" fill="url(#shineg)"/>

    </g>
  </g>

</g></g>
</g>

<!-- Hint text -->
<text x="210" y="694" text-anchor="middle" font-size="9" font-weight="600" fill="#818cf8" opacity="0.7" letter-spacing="1">✦  Hover to interact  ✦</text>

</svg>
